[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "enterprise-rag-assistant"
version = "1.0.0"
description = "Production-style enterprise knowledge assistant using retrieval-augmented generation"
requires-python = ">=3.10"

[tool.setuptools.packages.find]
where = ["src"]
